name: Upstream Sync with Conflict Detection

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch:
jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main-cris branch
        uses: actions/checkout@v4
        with:
          ref: main-cris

      - name: Set up Git config
        run: |
          git config --global user.email "vincenzo.mecca@4science.com"
          git config --global user.name "vins01-4science"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/DSpace/DSpace.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main into main-cris
        run: |
          git merge upstream/main || echo "Merge conflict. Creating PR for manual resolution."

      - name: Push changes (if no conflict)
        run: |
          git push origin main-cris
        continue-on-error: true

      - name: Create Pull Request if merge conflicts
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          title: "Sync upstream/main into main-cris (conflicts need resolution)"
          body: "This PR ports changes from upstream/main to main-cris. Please resolve conflicts if present."
          base: main-cris
          branch: sync-upstream-main-to-main-cris
          labels: upstream-sync
          assignees: vins01-4science

      # Optional: Auto-merge if possible
      - name: Attempt auto-merge PR if no conflicts
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'sync-upstream-main-to-main-cris',
              base: 'main-cris',
              state: 'open'
            });
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              if (pr.mergeable_state === 'clean') {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });
              }
            }
