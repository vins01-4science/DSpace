name: Upstream Sync with Conflict Detection

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your branch
        uses: actions/checkout@v4
        with:
          ref: main-cris

      - name: Set up Git credentials
        run: |
          git config --global user.email "vincenzo.mecca@4science.com"
          git config --global user.name "vins01-4science"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/DSpace/DSpace.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Create PR to port changes
        uses: peter-evans/create-pull-request@v5
        with:
          title: "Sync upstream changes"
          body: "Automated PR to sync changes from upstream/main to mybranch"
          base: main-cris
          head: upstream/main
          assignees: vins01-4science
          branch: sync-upstream-main-to-mybranch
          labels: upstream-sync

      - name: Attempt auto-merge if no conflicts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'sync-upstream-main-to-mybranch',
              base: 'main-cris',
              state: 'open'
            });
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              if (pr.mergeable_state === 'clean') {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });
              } else {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: ['vins01-4science']
                });
              }
            }
