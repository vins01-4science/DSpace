name: Gate integrity

# S1: `on: pull_request` executes the workflow definition from the PR's merge ref,
# which includes the PR's own head. A same-repo PR can therefore rewrite the
# affected-test gate (test-affected.yml) to `exit 0` and still satisfy the required
# check. This workflow uses `pull_request_target`, which ALWAYS runs this file from
# the BASE branch and never checks out or executes PR code: it only reads the PR's
# changed-file list over the API. If the PR edits the pipeline/gate itself, the check
# fails loudly instead of letting the change certify itself.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gate-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate-integrity:
    name: gate-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject PRs that modify the test pipeline / gate itself
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Paths whose change would let a PR alter how its own verdict is computed.
          # pom.xml (any module) carries the surefire/failsafe/JaCoCo test wiring too (G11).
          PROTECTED='^(\.github/|tools/|dspace-test-trace/)|(^|/)pom\.xml$'
          PR="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          # G2: GitHub caps the files API at 3000 entries. If the PR reports more
          # changed files than the API returned, the list is incomplete: fail closed
          # rather than risk a protected change hiding past the cap.
          changed="$(gh api "$PR" --jq '.changed_files')"
          files_json="$(gh api --paginate "$PR/files?per_page=100" --jq '.[] | @json')"
          nfiles="$(printf '%s\n' "$files_json" | grep -c . || true)"
          if [ "$changed" -gt "$nfiles" ] || [ "$nfiles" -ge 3000 ]; then
            echo "::error::Cannot fully enumerate this PR's changed files (reported $changed, API returned $nfiles; GitHub caps at 3000)."
            echo "The gate refuses to certify a PR whose file list may hide a pipeline/gate change."
            exit 1
          fi
          # G1: include BOTH sides of a rename. Moving a protected file out of
          # .github/ or tools/ or dspace-test-trace/ leaves previous_filename set, so
          # the guard still fires.
          all_paths="$(printf '%s\n' "$files_json" | jq -r '.filename, (.previous_filename // empty)')"
          hits="$(printf '%s\n' "$all_paths" | grep -E "$PROTECTED" || true)"
          if [ -n "$hits" ]; then
            echo "::error::This PR modifies the test pipeline / gate itself:"
            printf '%s\n' "$hits"
            echo "The affected-test gate cannot certify a PR that edits the gate."
            echo "A maintainer must review and merge this change deliberately."
            exit 1
          fi
          echo "No gate or pipeline files modified."
