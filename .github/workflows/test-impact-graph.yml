# Test Impact Graph — per-test coverage → change-impact index
#
# Builds a repo-wide test-impact index (impact-index.sqlite) so that, given a
# changed source file / property / config file / bean declaration, you can look
# up the tests that must be re-run. See tools/test-graph/ for the tooling.
#
# Pipeline (per module, via tools/test-graph/phase-all.sh):
#   1. Run unit + integration tests under the `test-class-graph` Maven profile,
#      which attaches the JaCoCo agent (jmx) and the dspace-test-trace listener
#      that dumps one .exec file per test method.
#   2. Extract the static class graph + config/property/bean refs.
#   3. Build the per-module impact index (class -> tests, property -> tests, ...).
#   4. Aggregate every module index into a single root impact-index.sqlite.
#
# The resulting artifact is published so downstream jobs / PRs can query it
# with:  tools/test-graph/run.sh impacted --db <artifact> --property mail.server
name: Test Impact Graph

on:
  # Manual trigger (recommended — this is a heavy, whole-repo run).
  workflow_dispatch:
  # Also build on pull requests so the index reflects the change under review.
  pull_request:

permissions:
  contents: read  # to fetch code (actions/checkout) and publish the artifact

jobs:
  impact-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAVEN_OPTS: "-Xmx2048M"
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      # Resolve the jars the single-file TestGraph.java tool needs at runtime.
      - name: Fetch test-graph tool dependencies
        run: |
          mvn -B -V dependency:get -Dartifact=org.jacoco:org.jacoco.core:0.8.14
          mvn -B -V dependency:get -Dartifact=org.ow2.asm:asm:9.7.1
          mvn -B -V dependency:get -Dartifact=org.xerial:sqlite-jdbc:3.21.0.1

      # dspace-test-trace is NOT part of the reactor (it is added as a test
      # dependency by the test-class-graph profile), so install it explicitly.
      - name: Install dspace-test-trace listener
        run: mvn -B -V install -f dspace-test-trace/pom.xml -DskipTests

      # Assemble the test install (dspace-server-webapp test environment) once,
      # so every module's tests (notably dspace-api's AbstractDSpaceTest) can run.
      - name: Assemble test install (skip tests)
        run: |
          mvn -B -V install -P-assembly -Ptest-class-graph \
            -DskipTests -DskipUnitTests=true -DskipIntegrationTests=true \
            -Denforcer.skip=true -Dcheckstyle.skip=true -Dlicense.skip=true \
            -Dxml.skip=true -Dspotbugs.skip=true -Dpmd.skip=true

      # Run per-test coverage (unit + integration) across all modules,
      # build per-module indexes and aggregate into the root index.
      - name: Build test-impact index
        run: |
          bash tools/test-graph/phase-all.sh --it --root . \
            --out target/test-graph/root-index.sqlite

      # Smoke-check the produced index before publishing it.
      - name: Validate test-impact index
        run: |
          bash tools/test-graph/run.sh validate \
            --db target/test-graph/root-index.sqlite || true

      - name: Upload impact-index.sqlite artifact
        uses: actions/upload-artifact@v7
        with:
          name: impact-index
          path: target/test-graph/root-index.sqlite
          retention-days: 30
