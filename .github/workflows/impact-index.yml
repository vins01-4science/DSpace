# Impact Index (baseline) — builds and publishes the repo-wide test-impact
# index from `main`.
#
# The index maps every source class / property / config file / bean declaration
# to the tests that must be re-run when it changes. Pull-request runs
# (test-affected.yml) and the incremental merge-patch (merge-patch.yml)
# download THIS artifact instead of rebuilding it.
#
# Cadence: this is the FULL rebuild — a weekly safety net that catches coverage
# drift, line-shift degradation, new classes and behavior the per-merge patches
# could not track. Every push to `main` is handled cheaply by merge-patch.yml
# (incremental), which re-runs only the affected tests and merges the result
# into the previous baseline. Trigger: weekly cron + manual dispatch.
#
# Parallelization strategy: tests are sharded across a CI matrix. Each matrix
# cell runs ONE module + ONE shard (a subset of that module's test classes) and
# produces a PARTIAL index from only that shard's coverage. A final `merge` job
# downloads every partial index and unions them with `aggregate` into the
# repo-wide `root-index.sqlite`. Because each shard observes a disjoint set of
# tests, the union is content-equivalent to a single sequential build.
name: Impact Index (baseline)

on:
  schedule:
    # Weekly full rebuild (Monday 03:00 UTC) — the safety net.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read  # checkout + publish artifact

jobs:
  # Emit the build matrix: one cell per (module, shard). Shard counts are tuned
  # to each module's test volume; raise a number to spread that module's tests
  # across more workers.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set
        run: |
          # module:shardCount
          # Tuned to test volume per module: dspace-api and dspace-server-webapp
          # have comparable test-minute totals (~52 vs ~58), so webapp gets more
          # workers (its `--it` REST ITs boot many Spring contexts). Keep the
          # per-cell duration within the free-tier wall-clock budget.
          SHARDS=(
            "dspace-api:6"
            "dspace-server-webapp:8"
            "dspace-oai:2"
            "dspace-services:1"
            "dspace-rdf:1"
            "dspace-sword:1"
            "dspace-swordv2:1"
            "dspace-iiif:1"
            "dspace-saml2:1"
          )
          items=()
          for entry in "${SHARDS[@]}"; do
            mod="${entry%%:*}"; total="${entry##*:}"
            for ((i=1; i<=total; i++)); do
              items+=("{\"module\":\"$mod\",\"shard\":$i,\"total\":$total}")
            done
          done
          json=$(printf '%s\n' "${items[@]}" | paste -sd, -)
          echo "matrix={\"include\":[$json]}" >> "$GITHUB_OUTPUT"

  # Assemble the test install ONCE (installs all modules + the server-webapp
  # test environment + the dspace-test-trace listener into the local Maven
  # repo). The parallel `build` jobs depend on this job and reuse the populated
  # `cache: maven`, so they only compile and test their own module.
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAVEN_OPTS: "-Xmx2048M"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      # Persist the Maven build-cache directory (the extension's content-
      # addressed store). Shared across all build jobs via restore-keys.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: maven-build-cache-${{ runner.os }}-assemble
          restore-keys: maven-build-cache-${{ runner.os }}-

      # Maven build-cache extension + the jars the single-file TestGraph.java
      # tool needs at runtime. Guarded: only fires mvn when a jar is genuinely
      # missing. Fetched in assemble so the build jobs hit the `cache: maven`.
      - name: Fetch test-graph deps + build-cache extension (if not cached)
        run: |
          M2="$HOME/.m2/repository"
          for artifact in \
            "org.jacoco:org.jacoco.core:0.8.14" \
            "org.ow2.asm:asm:9.7.1" \
            "org.xerial:sqlite-jdbc:3.21.0.1" \
            "org.apache.maven.extensions:maven-build-cache-extension:1.2.3"; do
            g="${artifact%%:*}"; rest="${artifact#*:}"; a="${rest%%:*}"; v="${rest#*:}"
            if [ ! -f "$M2/${g//.//}/$a/$v/$a-$v.jar" ]; then
              echo "fetching $artifact"
              mvn -B -V dependency:get -Dartifact="$artifact"
            fi
          done

      # Enable the Maven build-cache extension (see merge-patch.yml): restores
      # per-goal outputs keyed on real inputs; surefire/failsafe are in
      # executionControl/runAlways so tests ALWAYS execute (fresh .exec).
      - name: Enable Maven build cache (compile-restore only; tests always run)
        run: |
          mkdir -p "$RUNNER_TEMP/build-cache-config"
          cat > "$RUNNER_TEMP/build-cache-config/maven-build-cache-config.xml" <<'EOF'
          <cache xmlns="http://maven.apache.org/BUILD-CACHE-CONFIG/1.2.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/BUILD-CACHE-CONFIG/1.2.0 https://maven.apache.org/xsd/build-cache-config-1.2.0.xsd">
              <configuration>
                  <enabled>true</enabled>
              </configuration>
              <executionControl>
                  <runAlways>
                      <plugins>
                          <plugin artifactId="maven-surefire-plugin"/>
                          <plugin artifactId="maven-failsafe-plugin"/>
                      </plugins>
                  </runAlways>
              </executionControl>
          </cache>
          EOF
          echo "MAVEN_OPTS=-Xmx2048M -Dmaven.ext.class.path=$HOME/.m2/repository/org/apache/maven/extensions/maven-build-cache-extension/1.2.3/maven-build-cache-extension-1.2.3.jar -Dmaven.build.cache.configPath=$RUNNER_TEMP/build-cache-config/maven-build-cache-config.xml -Dmaven.build.cache.location=$HOME/.m2/build-cache" >> "$GITHUB_ENV"

      # dspace-test-trace is NOT part of the reactor (added as a test dependency
      # by the test-class-graph profile), so install it explicitly.
      - name: Install dspace-test-trace listener
        run: mvn -B -V install -f dspace-test-trace/pom.xml -DskipTests

      # Assemble the test install (dspace-server-webapp test environment) once,
      # so every module's tests (notably dspace-api's AbstractDSpaceTest) can run.
      - name: Assemble test install (skip tests)
        run: |
          mvn -B -V install -P-assembly -Ptest-class-graph \
            -DskipTests -DskipUnitTests=true -DskipIntegrationTests=true \
            -Denforcer.skip=true -Dcheckstyle.skip=true -Dlicense.skip=true \
            -Dxml.skip=true -Dspotbugs.skip=true -Dpmd.skip=true

  # One cell per (module, shard): run ONLY that shard's tests and write a
  # PARTIAL index. Runs in parallel; a shard's test failure does not fail the
  # job (the partial index is still produced — the PR gate runs the real
  # affected tests and would surface failures).
  build:
    needs: [plan, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      MAVEN_OPTS: "-Xmx2048M"
      # Every module builds offline: `assemble` already installed the full
      # reactor with -Ptest-class-graph, so its test-side jars (surefire,
      # failsafe, jacoco agent, junit-platform) are all in the Maven cache.
      MVN: "mvn -o -B"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      # Persist the Maven build-cache directory per module (shared across shards
      # of the same module via restore-keys).
      - uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: maven-build-cache-${{ runner.os }}-${{ matrix.module }}
          restore-keys: |
            maven-build-cache-${{ runner.os }}-${{ matrix.module }}
            maven-build-cache-${{ runner.os }}-

      # Enable the Maven build-cache extension (see merge-patch.yml): restores
      # per-goal outputs keyed on real inputs; surefire/failsafe are in
      # executionControl/runAlways so tests ALWAYS execute (fresh .exec).
      - name: Enable Maven build cache (compile-restore only; tests always run)
        run: |
          mkdir -p "$RUNNER_TEMP/build-cache-config"
          cat > "$RUNNER_TEMP/build-cache-config/maven-build-cache-config.xml" <<'EOF'
          <cache xmlns="http://maven.apache.org/BUILD-CACHE-CONFIG/1.2.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/BUILD-CACHE-CONFIG/1.2.0 https://maven.apache.org/xsd/build-cache-config-1.2.0.xsd">
              <configuration>
                  <enabled>true</enabled>
              </configuration>
              <executionControl>
                  <runAlways>
                      <plugins>
                          <plugin artifactId="maven-surefire-plugin"/>
                          <plugin artifactId="maven-failsafe-plugin"/>
                      </plugins>
                  </runAlways>
              </executionControl>
          </cache>
          EOF
          echo "MAVEN_OPTS=-Xmx2048M -Dmaven.ext.class.path=$HOME/.m2/repository/org/apache/maven/extensions/maven-build-cache-extension/1.2.3/maven-build-cache-extension-1.2.3.jar -Dmaven.build.cache.configPath=$RUNNER_TEMP/build-cache-config/maven-build-cache-config.xml -Dmaven.build.cache.location=$HOME/.m2/build-cache" >> "$GITHUB_ENV"

      # Resolve the jars the single-file TestGraph.java tool needs at runtime.
      # Guarded: `assemble` warms jacoco/asm into the cache, so this only fires
      # mvn when a jar is genuinely missing (cold cache).
      - name: Fetch test-graph tool dependencies (if not cached)
        run: |
          M2="$HOME/.m2/repository"
          for artifact in \
            "org.jacoco:org.jacoco.core:0.8.14" \
            "org.ow2.asm:asm:9.7.1" \
            "org.xerial:sqlite-jdbc:3.21.0.1" \
            "org.apache.maven.extensions:maven-build-cache-extension:1.2.3"; do
            g="${artifact%%:*}"; rest="${artifact#*:}"; a="${rest%%:*}"; v="${rest#*:}"
            if [ ! -f "$M2/${g//.//}/$a/$v/$a-$v.jar" ]; then
              echo "fetching $artifact"
              mvn -B -V dependency:get -Dartifact="$artifact"
            fi
          done

      # dspace-test-trace + all upstream modules are already in the Maven cache
      # (populated by the `assemble` job), so only this module is built/tested.
      - name: Build partial impact index (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: |
          bash tools/test-graph/phase-module.sh "${{ matrix.module }}" \
            --shard ${{ matrix.shard }} ${{ matrix.total }} --it --root . \
            --db-out "target/test-graph/idx-${{ matrix.module }}-${{ matrix.shard }}.sqlite"

      - name: Upload partial index
        uses: actions/upload-artifact@v7
        with:
          name: idx-${{ matrix.module }}-${{ matrix.shard }}
          path: target/test-graph/idx-${{ matrix.module }}-${{ matrix.shard }}.sqlite
          retention-days: 7

  # Download every partial index and union them into the repo-wide index.
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAVEN_OPTS: "-Xmx2048M"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Fetch test-graph tool dependencies (if not cached)
        run: |
          M2="$HOME/.m2/repository"
          for artifact in \
            "org.jacoco:org.jacoco.core:0.8.14" \
            "org.ow2.asm:asm:9.7.1" \
            "org.xerial:sqlite-jdbc:3.21.0.1"; do
            g="${artifact%%:*}"; rest="${artifact#*:}"; a="${rest%%:*}"; v="${rest#*:}"
            if [ ! -f "$M2/${g//.//}/$a/$v/$a-$v.jar" ]; then
              echo "fetching $artifact"
              mvn -B -V dependency:get -Dartifact="$artifact"
            fi
          done

      - name: Download partial indexes
        uses: actions/download-artifact@v7
        with:
          pattern: idx-*
          path: partial
          merge-multiple: true

      - name: Aggregate into root index
        run: |
          ARGS=()
          i=1
          while IFS= read -r f; do
            if [[ $i -eq 1 ]]; then ARGS+=(--db "$f"); else ARGS+=(--db$i "$f"); fi
            i=$((i+1))
          done < <(find partial -name 'idx-*.sqlite' | sort)
          if [[ ${#ARGS[@]} -eq 0 ]]; then
            echo "No partial indexes downloaded!" >&2; exit 1
          fi
          bash tools/test-graph/run.sh aggregate \
            --out target/test-graph/root-index.sqlite "${ARGS[@]}"

      - name: Validate test-impact index
        run: bash tools/test-graph/run.sh validate --db target/test-graph/root-index.sqlite || true

      - name: Record source commit
        run: echo "${{ github.sha }}" > target/test-graph/built-from.txt

      - name: Upload impact-index artifact
        uses: actions/upload-artifact@v7
        with:
          name: impact-index
          path: |
            target/test-graph/root-index.sqlite
            target/test-graph/built-from.txt
          retention-days: 90
