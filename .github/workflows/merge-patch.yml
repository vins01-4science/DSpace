# Merge Patch (baseline) — incremental update of the test-impact index on every
# change that lands on `main`.
#
# Full rebuilds (impact-index.yml) are expensive (21+ sharded test jobs) and are
# now only run weekly as a safety net. This workflow keeps the published
# baseline fresh in between: it diffs the new HEAD against the commit the last
# baseline was built from, re-runs ONLY the tests affected by that diff, and
# merges their fresh coverage into the existing baseline.
#
# Why this is correct:
#   - Patch semantics == `aggregate --db <baseline> --db2 <delta>`. cov_data is
#     keyed by (class), each blob = per-test line sets. The union of baseline +
#     delta is conservative: a re-run test's fresher lines replace the old ones
#     (union), classes/tests not re-run keep their baseline entries, and the
#     static tables (class_refs, property_impact, ...) are recomputed from the
#     unioned inputs. Nothing is ever under-selected; over-conservative overlap
#     is healed by the weekly full rebuild.
#   - The PR gate (test-affected.yml) already validated the changes green when
#     they merged, so this workflow may treat affected-test failures as coverage
#     loss, not merge blockers.
#
# Output: a new `impact-index` artifact (root-index.sqlite + built-from.txt set
# to the pushed SHA), same name/path as impact-index.yml so every consumer
# (test-affected.yml) keeps working and always resolves the newest baseline.
name: Merge Patch (baseline)

on:
  push:
    branches: [main, task/test-class-graph-phase0]
  workflow_dispatch:
    inputs:
      baseline_branch:
        description: "Branch to resolve the latest impact-index baseline from (default: the branch this run is on)"
        required: false

permissions:
  contents: read   # checkout + publish artifact
  actions: read    # download the previous baseline artifact

concurrency:
  group: merge-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAVEN_OPTS: "-Xmx2048M"
      MVN: "mvn -o -B"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      # The jars the single-file TestGraph.java tool needs at runtime. Guarded:
      # only fires mvn when a jar is genuinely missing (cold ~/.m2).
      #
      # NOTE: the Maven build-cache extension is deliberately NOT used here. It
      # never restored in practice (each run reinstalls fresh SNAPSHOT artifacts,
      # so the input checksum — and the dependency set — changes every run and the
      # whole reactor recompiles anyway, c.f. "Recompiling the module because of
      # changed dependency" / "Compiling 1784 source files"), and its plugin-config
      # restore corrupted the forked test JVM's environment (all affected tests
      # errored with "DSpace home directory could not be determined" while the
      # same command passes locally). Deterministic, slower-but-correct.
      - name: Fetch test-graph runtime deps (if not cached)
        run: |
          M2="$HOME/.m2/repository"
          # The reactor's JaCoCo coverage profiles (active when tests run) bind
          # jacoco-maven-plugin at the version pinned in pom.xml pluginManagement
          # (0.8.14 on older branches, 0.8.15 on newer upstream). Resolve it from
          # the pom — hardcoding it made the OFFLINE `mvn -o` runs die with
          # "Plugin org.jacoco:jacoco-maven-plugin:<pin> could not be resolved"
          # as soon as an older feature branch got merged onto newer main.
          # Resolve the jacoco plugin version from the reactor pom (literal or
          # ${property}); a structural pom change must not silently fall back.
          # Single source of truth for the resolver and the blast regex (G9).
          . tools/test-graph/pipeline-lib.sh
          JV="$(jacoco_version pom.xml)"
          if [[ "$JV" == *'${'* ]]; then
            JP="$(sed -E 's/.*\$\{([^}]+)\}.*/\1/' <<<"$JV")"
            JV="$(sed -nE "s#.*<$JP>([^<]+)</$JP>.*#\1#p" pom.xml | head -1)"
          fi
          if [[ ! "$JV" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "!! could not resolve jacoco-maven-plugin version from pom.xml (got '$JV')" >&2
            exit 1
          fi
          echo "jacoco version: $JV"
          for artifact in \
            "org.jacoco:org.jacoco.core:$JV" \
            "org.jacoco:jacoco-maven-plugin:$JV" \
            "org.ow2.asm:asm:9.7.1" \
            "org.xerial:sqlite-jdbc:3.21.0.1" \
            "org.apache.maven.plugins:maven-surefire-plugin:3.5.3" \
            "org.apache.maven.plugins:maven-failsafe-plugin:3.5.3" \
            "org.apache.maven.surefire:surefire-junit-platform:3.5.3" \
            "org.apache.maven.surefire:surefire-junit4:3.5.3"; do
            g="${artifact%%:*}"; rest="${artifact#*:}"; a="${rest%%:*}"; v="${rest#*:}"
            if [ ! -f "$M2/${g//.//}/$a/$v/$a-$v.jar" ]; then
              echo "fetching $artifact"
              mvn -B -V dependency:get -Dartifact="$artifact"
            fi
          done

      - name: Install listener + test install (skip tests)
        run: |
          mvn -B -V install -f dspace-test-trace/pom.xml -DskipTests
          mvn -B -V install -P-assembly -Ptest-class-graph \
            -DskipTests -DskipUnitTests=true -DskipIntegrationTests=true \
            -Denforcer.skip=true -Dcheckstyle.skip=true -Dlicense.skip=true \
            -Dxml.skip=true -Dspotbugs.skip=true -Dpmd.skip=true

      - name: Download previous baseline (latest full or patch)
        id: baseline
        run: |
          # Default = the branch this run is on (pushed ref or dispatched ref), so the
          # baseline is looked up where that branch's own runs published one
          # (feature branch validates pre-merge; main uses main's). An explicit
          # workflow_dispatch input overrides it.
          BRANCH="${{ inputs.baseline_branch || github.ref_name }}"
          latest() {
            # Newest successful run of $1 on $BRANCH that actually carries an
            # `impact-index` artifact. A green merge-patch run can legitimately
            # publish nothing (cold-start skip), so candidate selection is by
            # artifact presence, not by conclusion.
            #
            # Failure policy: the `gh run list` call may not be masked — an
            # auth/network failure must kill this step loudly, not be disguised
            # as "no baseline yet". The per-run artifacts probe is exempt from
            # `set -e` by sitting in an `if` condition, but its own failure is
            # still detected explicitly and aborts the step. Only a *genuine*
            # empty result (no runs, or runs with no `impact-index` artifact)
            # yields an empty string with exit 0.
            cand="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --status success \
              --workflow "$1" --limit 20 --json databaseId --jq '.[].databaseId')"
            # `cand` may be genuinely empty (cold branch: zero successful runs).
            # A raw `printf '%s\n' "$cand"` would emit ONE blank line, making the
            # loop probe run "" and hit HTTP 404 — a hard failure on the exact
            # cold-start path this function exists to detect. Guard it (and blank
            # ids) explicitly. `gh run list` itself is still unmasked: an
            # auth/network failure keeps killing the step loudly.
            if [ -z "$cand" ]; then return 0; fi
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                --jq '.artifacts[]?.name')" || {
                echo "!! artifacts probe failed for run $id" >&2; exit 1; }
              if printf '%s\n' "$names" | grep -qx 'impact-index'; then
                echo "$id"; break
              fi
            done <<< "$cand"
          }
          ID_FULL=$(latest "impact-index.yml")
          ID_PATCH=$(latest "merge-patch.yml")
          RUN_ID=""
          if [ -n "$ID_FULL" ] && [ -n "$ID_PATCH" ]; then
            if [ "$ID_PATCH" -gt "$ID_FULL" ]; then RUN_ID="$ID_PATCH"; else RUN_ID="$ID_FULL"; fi
          elif [ -n "$ID_FULL" ]; then RUN_ID="$ID_FULL"
          elif [ -n "$ID_PATCH" ]; then RUN_ID="$ID_PATCH"; fi
          if [ -z "$RUN_ID" ]; then
            echo "No baseline index exists yet — skip patch (first weekly full rebuild will create it)."
            exit 0
          fi
          gh run download "$RUN_ID" -n impact-index -D ./idx
          BASE_SHA="$(cat ./idx/built-from.txt 2>/dev/null || true)"
          if [ -z "$BASE_SHA" ]; then
            echo "Baseline artifact lacks built-from.txt — cannot diff. Skip patch."
            exit 0
          fi
          if [ "$BASE_SHA" = "${{ github.sha }}" ]; then
            echo "Baseline already reflects this SHA — nothing to patch."
            exit 0
          fi
          echo "db=$(pwd)/idx/root-index.sqlite" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Using baseline from run $RUN_ID (built from $BASE_SHA)"

      - name: Compute affected tests since last baseline commit
        id: affected
        if: steps.baseline.outputs.db != ''
        run: |
          bash tools/test-graph/affected.sh \
            --db "${{ steps.baseline.outputs.db }}" \
            --base "${{ steps.baseline.outputs.base_sha }}" \
            --head "${{ github.sha }}" \
            --out target/test-graph/affected
          UT="$(cat target/test-graph/affected/ut.csv)"
          IT="$(cat target/test-graph/affected/it.csv)"
          # Blast-radius: a dependency bump, shared-config change, or a change to
          # the pipeline's own surface (workflows/tools) invalidates the index's
          # notion of "affected". Never skip in that case, or the baseline would
          # advance untested (F4: pom.xml-only push copied the old DB and moved
          # built-from forward). Blast forces the full reactor in the run step.
          # --no-renames: a rename yields BOTH the old and new path; T: a
          # typechange (file -> symlink) is a real change. Guards against hiding
          # a guarded-path change (S2/S8).
          CHANGED="$(git diff --no-renames --name-only --diff-filter=ADMRT \
            "${{ steps.baseline.outputs.base_sha }}...${{ github.sha }}")" || {
            echo "!! git diff ${{ steps.baseline.outputs.base_sha }}...${{ github.sha }} failed" >&2
            exit 1; }
          # Blast-radius + inert definitions are shared with test-affected (G9).
          . tools/test-graph/pipeline-lib.sh
          BLAST=0
          if printf '%s\n' "$CHANGED" | grep -qE "$BLAST_RE"; then
            BLAST=1
            echo "Blast-radius change (pom/config/workflows/tools) -> running the FULL reactor (no skip)."
          fi
          # Reflection safety net (ASM phase 0): affected.sh leaves force_full when
          # a changed class touches Class.forName / loadClass / ServiceLoader /
          # reflection. Force the full reactor (no skip) so the baseline cannot
          # advance untested.
          if [ -f target/test-graph/affected/force_full ]; then
            BLAST=1
            echo "Reflection safety net -> running the FULL reactor (no skip)."
            cat target/test-graph/affected/force_full
          fi
          # S10: the index can return an empty set for a genuinely-not-indexed
          # change (a new FQCN absent from the baseline, or a non-modeled file
          # type such as .sql/.js/.csv). Only a docs-only diff may skip; any other
          # unclassified change must run tests, or the baseline would advance
          # with zero tests executed.
          FALLBACK_MODULES=""
          if [ "$BLAST" -eq 0 ] && [ -z "$UT" ] && [ -z "$IT" ]; then
            NONINERT=$(printf '%s\n' "$CHANGED" | grep -v '^[[:space:]]*$' | grep -vE "$INERT_RE" || true)
            if [ -z "$NONINERT" ]; then
              echo "Nothing affected since ${{ steps.baseline.outputs.base_sha }} (docs-only) — baseline is already current."
              echo "skip=1" >> "$GITHUB_OUTPUT"
            else
              FALLBACK_MODULES=$(printf '%s\n' "$CHANGED" | cut -d/ -f1 | grep '^dspace' | sort -u \
                | while read -r m; do [ -f "$m/pom.xml" ] && echo "$m"; done | paste -sd, - || true)
              if [ -z "$FALLBACK_MODULES" ]; then
                # Unclassified non-doc change with no known module -> full reactor.
                BLAST=1
                echo "Unclassified non-doc change with no known module -> FULL reactor (no skip)."
              else
                echo "Index found nothing but modules changed -> full suites of: $FALLBACK_MODULES"
              fi
            fi
          fi
          echo "blast=$BLAST" >> "$GITHUB_OUTPUT"
          echo "ut=$UT" >> "$GITHUB_OUTPUT"
          echo "it=$IT" >> "$GITHUB_OUTPUT"
          echo "modules=$FALLBACK_MODULES" >> "$GITHUB_OUTPUT"
          # prune=1 only on a blast/full-reactor run, where EVERY module was
          # recompiled. Then a test class missing from target/test-classes is
          # genuinely gone and can be pruned from the merged index (G6). A
          # narrowed run must NOT prune: unrebuilt modules would lose live tests.
          echo "prune=$BLAST" >> "$GITHUB_OUTPUT"

      - name: Run affected tests with per-test coverage
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip != '1'
        run: |
          cd "$GITHUB_WORKSPACE"
          # Run reactor-wide rather than narrowing with -pl: a test in one module
          # can be impacted by a source change in another (e.g. Context.java in
          # dspace-api impacts org.dspace.app.rest.* in dspace-server-webapp), so
          # the affected set may name tests outside the modules of the changed
          # files. -Dtest/-Dit.test still bound execution; every module is already
          # installed into the local repo, so this only recompiles incrementally.
          UT="${{ steps.affected.outputs.ut }}"
          IT="${{ steps.affected.outputs.it }}"
          BLAST="${{ steps.affected.outputs.blast }}"
          MODULES="${{ steps.affected.outputs.modules }}"
          # Do NOT pass -am here. With -am, dspace-parent is rebuilt inside this
          # reactor, which re-assembles testEnvironment.zip WITHOUT the
          # org.dspace:dspace module (never built by a -am reactor) — that zip is
          # incomplete (no config-definition.xml/dspace.cfg/solr), so every
          # affected test errors with "DSpace home directory could not be
          # determined". The install step above already put a complete zip (and
          # all modules) into the local repo, so the reactor resolves everything
          # from m2.
          if [ "$BLAST" = "1" ]; then
            # Blast radius -> the index cannot bound the impact. Run the whole
            # reactor (verify covers both surefire UT and failsafe IT). A non-zero
            # exit FAILS the run: losing all per-test coverage was the original
            # false-green bug of this workflow.
            echo "Blast-radius change -> running the FULL reactor (UT + IT)."
            $MVN -Ptest-class-graph -DskipUnitTests=false -DskipIntegrationTests=false \
              -DfailIfNoTests=false verify \
              || { echo "!! full-reactor tests FAILED (see surefire/failsafe summaries above)"; exit 1; }
          else
            if [ -n "$UT" ]; then
              # $MVN unquoted on purpose: job env MVN="mvn -o -B" is a flag string,
              # and word-splitting must apply (a quoted "$MVN" would be one command).
              #
              # A non-zero exit here FAILS the run. Test failures or a broken test
              # environment must surface loudly — a green run that silently lost all
              # per-test coverage was the original false-green bug of this workflow.
              $MVN -Ptest-class-graph -DskipUnitTests=false -DskipIntegrationTests=true \
                -DfailIfNoTests=false test "-Dtest=$UT" \
                || { echo "!! affected unit tests FAILED (see surefire summary above)"; exit 1; }
            fi
            if [ -n "$IT" ]; then
              $MVN -Ptest-class-graph -DskipUnitTests=true -DskipIntegrationTests=false \
                -DfailIfNoTests=false verify "-Dit.test=$IT" \
                || { echo "!! affected integration tests FAILED (see failsafe summary above)"; exit 1; }
            fi
            if [ -n "$MODULES" ] && [ -z "$UT" ] && [ -z "$IT" ]; then
              # S10 fallback: the index found nothing for a non-doc change, so run
              # the full suites of the touched modules (reactor artifacts are in m2
              # from the install step, hence no -am). A non-zero exit FAILS the run;
              # the baseline must not advance on a failed/empty test run.
              echo "Module fallback -> full suites (UT + IT) of: $MODULES"
              $MVN -Ptest-class-graph -pl "$MODULES" -DskipUnitTests=false -DskipIntegrationTests=false \
                -DfailIfNoTests=false verify \
                || { echo "!! module-fallback tests FAILED (see surefire/failsafe summaries above)"; exit 1; }
            fi
          fi

          # S4 (mirror of test-affected.yml): the run is only valid if the selected
          # classes actually produced reports. -DfailIfNoTests=false turns a
          # renamed/stale class into a silent no-op, and a zero-execution run must
          # not advance the baseline.
          REPORTS="$(find . -path '*/target/*-reports/TEST-*.xml' -printf '%f\n' 2>/dev/null \
            | sed -e 's/^TEST-//' -e 's/\.xml$//')"
          RAN="$(printf '%s\n' "$REPORTS" | grep -c . || true)"
          if [ "$RAN" -eq 0 ]; then
            echo "!! tests were selected but NO surefire/failsafe reports were produced"
            exit 1
          fi
          MISSING=0
          for name in $(printf '%s\n' "$UT" "$IT" | tr ',' '\n'); do
            [ -z "$name" ] && continue
            base="${name##*.}"
            if ! printf '%s\n' "$REPORTS" | grep -qE "(^|[.]|[$])${base}$"; then
              echo "!! no test report for affected class: $name"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "!! affected run did not execute every named class"
            exit 1
          fi
          echo "report check OK: $RAN report(s), all named affected classes executed."

      - name: Build per-module delta partials
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip != '1'
        run: |
          mkdir -p target/test-graph/deltas
          total=0
          # Scan every dspace* module dir: the test run is reactor-wide, so
          # the .exec files can live in any module.
          for dir in $(ls -d dspace*/ 2>/dev/null); do
            mod="${dir%/}"
            [ -f "$mod/pom.xml" ] || continue
            [ -d "$mod/target/per-test" ] || continue
            n=$(find "$mod/target/per-test" -name '*.exec' | wc -l)
            [ "$n" -gt 0 ] || continue
            total=$((total + n))
            echo "delta partial for $mod ($n execs)"
            # --skip-tests: static + config + build from the .exec files already
            # produced above (no test re-run, per-test dir is preserved).
            bash tools/test-graph/phase-module.sh "$mod" --skip-tests \
              --db-out "target/test-graph/deltas/delta-$mod.sqlite"
          done
          if [ "$total" -eq 0 ]; then
            echo "!! affected tests were computed but NO per-test .exec coverage was produced (dead jacoco agent?) — refusing to advance the baseline" >&2
            exit 1
          fi

      - name: Merge deltas into baseline
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip != '1'
        run: |
          ARGS=("aggregate" "--out" "target/test-graph/root-index.sqlite")
          ARGS+=(--db "${{ steps.baseline.outputs.db }}")
          i=2
          for f in $(find target/test-graph/deltas -name 'delta-*.sqlite' | sort); do
            ARGS+=(--db$i "$f"); i=$((i+1))
          done
          # G6: on a full-reactor run every module compiled, so prune test keys
          # whose class no longer exists. On a narrowed run, skip pruning so an
          # unrebuilt module's live tests are never dropped.
          if [ "${{ steps.affected.outputs.prune }}" = "1" ]; then
            test_classes="$(find . -maxdepth 3 -type d -name test-classes -print | paste -sd: -)"
            if [ -z "$test_classes" ]; then
              echo "!! full-reactor run but no compiled test-classes found; refusing to skip pruning silently" >&2
              exit 1
            fi
            ARGS+=(--test-classes "$test_classes")
          fi
          bash tools/test-graph/run.sh "${ARGS[@]}" > target/test-graph/aggregate.log
          tail -5 target/test-graph/aggregate.log

      - name: Validate patched index
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip != '1'
        run: bash tools/test-graph/run.sh validate --db target/test-graph/root-index.sqlite

      - name: Keep prior baseline when nothing was affected
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip == '1'
        run: |
          mkdir -p target/test-graph
          cp "${{ steps.baseline.outputs.db }}" target/test-graph/root-index.sqlite

      - name: Record source commit
        if: steps.baseline.outputs.db != ''
        run: echo "${{ github.sha }}" > target/test-graph/built-from.txt

      - name: Upload impact-index artifact
        if: steps.baseline.outputs.db != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: impact-index
          path: |
            target/test-graph/root-index.sqlite
            target/test-graph/built-from.txt
          retention-days: 90