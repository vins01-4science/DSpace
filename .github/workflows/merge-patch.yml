# Merge Patch (baseline) — incremental update of the test-impact index on every
# change that lands on `main`.
#
# Full rebuilds (impact-index.yml) are expensive (21+ sharded test jobs) and are
# now only run weekly as a safety net. This workflow keeps the published
# baseline fresh in between: it diffs the new HEAD against the commit the last
# baseline was built from, re-runs ONLY the tests affected by that diff, and
# merges their fresh coverage into the existing baseline.
#
# Why this is correct:
#   - Patch semantics == `aggregate --db <baseline> --db2 <delta>`. cov_data is
#     keyed by (class), each blob = per-test line sets. The union of baseline +
#     delta is conservative: a re-run test's fresher lines replace the old ones
#     (union), classes/tests not re-run keep their baseline entries, and the
#     static tables (class_refs, property_impact, ...) are recomputed from the
#     unioned inputs. Nothing is ever under-selected; over-conservative overlap
#     is healed by the weekly full rebuild.
#   - The PR gate (test-affected.yml) already validated the changes green when
#     they merged, so this workflow may treat affected-test failures as coverage
#     loss, not merge blockers.
#
# Output: a new `impact-index` artifact (root-index.sqlite + built-from.txt set
# to the pushed SHA), same name/path as impact-index.yml so every consumer
# (test-affected.yml) keeps working and always resolves the newest baseline.
name: Merge Patch (baseline)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # checkout + publish artifact
  actions: read    # download the previous baseline artifact

concurrency:
  group: merge-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAVEN_OPTS: "-Xmx2048M"
      MVN: "mvn -o -B"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      # Persist the Maven build-cache directory across runs (the extension's own
      # content-addressed store). Keyed on the branch so consecutive pushes to
      # `main` share one cache.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: maven-build-cache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: maven-build-cache-${{ runner.os }}-

      # Maven build-cache extension + the jars the single-file TestGraph.java
      # tool needs at runtime. Guarded: only fires mvn when a jar is genuinely
      # missing (cold cache).
      - name: Fetch test-graph deps + build-cache extension (if not cached)
        run: |
          M2="$HOME/.m2/repository"
          for artifact in \
            "org.jacoco:org.jacoco.core:0.8.14" \
            "org.jacoco:jacoco-maven-plugin:0.8.14" \
            "org.ow2.asm:asm:9.7.1" \
            "org.xerial:sqlite-jdbc:3.21.0.1" \
            "org.apache.maven.plugins:maven-surefire-plugin:3.5.3" \
            "org.apache.maven.plugins:maven-failsafe-plugin:3.5.3" \
            "org.apache.maven.surefire:surefire-junit-platform:3.5.3" \
            "org.apache.maven.surefire:surefire-junit4:3.5.3" \
            "org.apache.maven.extensions:maven-build-cache-extension:1.2.3"; do
            g="${artifact%%:*}"; rest="${artifact#*:}"; a="${rest%%:*}"; v="${rest#*:}"
            if [ ! -f "$M2/${g//.//}/$a/$v/$a-$v.jar" ]; then
              echo "fetching $artifact"
              mvn -B -V dependency:get -Dartifact="$artifact"
            fi
          done

      # Enable the Maven build-cache extension for this job. It restores
      # per-goal OUTPUTS (compiled classes, jars) keyed on real inputs (sources,
      # poms, plugin config) — not wall-clock mtimes — so a warm cache lets Maven
      # skip recompiling the whole reactor on the next push.
      #
      # CRITICAL: maven-surefire-plugin / maven-failsafe-plugin are in
      # executionControl/runAlways, so test EXECUTION is never skipped from
      # cache. The per-test JaCoCo .exec files (and thus cov_data) are only as
      # good as the tests that actually ran; test goals must always execute.
      - name: Enable Maven build cache (compile-restore only; tests always run)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.mvn" "$RUNNER_TEMP/build-cache-config"
          # Load the extension as a CORE extension (repo-level .mvn/extensions.xml,
          # CI-only — never committed). `-Dmaven.ext.class.path` is NOT supported:
          # it loads in a child realm where Sisu cannot inject CacheControllerImpl.
          cat > "$GITHUB_WORKSPACE/.mvn/extensions.xml" <<'EOF'
          <extensions xmlns="http://maven.apache.org/EXTENSIONS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/EXTENSIONS/1.0.0 https://maven.apache.org/xsd/core-extensions-1.0.0.xsd">
              <extension>
                  <groupId>org.apache.maven.extensions</groupId>
                  <artifactId>maven-build-cache-extension</artifactId>
                  <version>1.2.3</version>
              </extension>
          </extensions>
          EOF
          cat > "$RUNNER_TEMP/build-cache-config/maven-build-cache-config.xml" <<'EOF'
          <cache xmlns="http://maven.apache.org/BUILD-CACHE-CONFIG/1.2.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/BUILD-CACHE-CONFIG/1.2.0 https://maven.apache.org/xsd/build-cache-config-1.2.0.xsd">
              <configuration>
                  <enabled>true</enabled>
              </configuration>
              <executionControl>
                  <runAlways>
                      <plugins>
                          <plugin artifactId="maven-surefire-plugin"/>
                          <plugin artifactId="maven-failsafe-plugin"/>
                      </plugins>
                  </runAlways>
              </executionControl>
          </cache>
          EOF
          echo "MAVEN_OPTS=-Xmx2048M -Dmaven.build.cache.configPath=$RUNNER_TEMP/build-cache-config/maven-build-cache-config.xml -Dmaven.build.cache.location=$HOME/.m2/build-cache" >> "$GITHUB_ENV"

      - name: Install listener + test install (skip tests)
        run: |
          mvn -B -V install -f dspace-test-trace/pom.xml -DskipTests
          mvn -B -V install -P-assembly -Ptest-class-graph \
            -DskipTests -DskipUnitTests=true -DskipIntegrationTests=true \
            -Denforcer.skip=true -Dcheckstyle.skip=true -Dlicense.skip=true \
            -Dxml.skip=true -Dspotbugs.skip=true -Dpmd.skip=true

      - name: Download previous baseline (latest full or patch)
        id: baseline
        run: |
          latest() {
            gh run list --repo "$GITHUB_REPOSITORY" --branch main --status success \
              --workflow "$1" --limit 1 --json databaseId --jq '.[0].databaseId' || true
          }
          ID_FULL=$(latest "impact-index.yml")
          ID_PATCH=$(latest "merge-patch.yml")
          RUN_ID=""
          if [ -n "$ID_FULL" ] && [ -n "$ID_PATCH" ]; then
            if [ "$ID_PATCH" -gt "$ID_FULL" ]; then RUN_ID="$ID_PATCH"; else RUN_ID="$ID_FULL"; fi
          elif [ -n "$ID_FULL" ]; then RUN_ID="$ID_FULL"
          elif [ -n "$ID_PATCH" ]; then RUN_ID="$ID_PATCH"; fi
          if [ -z "$RUN_ID" ]; then
            echo "No baseline index exists yet — skip patch (first weekly full rebuild will create it)."
            exit 0
          fi
          gh run download "$RUN_ID" -n impact-index -D ./idx
          BASE_SHA="$(cat ./idx/built-from.txt 2>/dev/null || true)"
          if [ -z "$BASE_SHA" ]; then
            echo "Baseline artifact lacks built-from.txt — cannot diff. Skip patch."
            exit 0
          fi
          if [ "$BASE_SHA" = "${{ github.sha }}" ]; then
            echo "Baseline already reflects this SHA — nothing to patch."
            exit 0
          fi
          echo "db=$(pwd)/idx/root-index.sqlite" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Using baseline from run $RUN_ID (built from $BASE_SHA)"

      - name: Compute affected tests since last baseline commit
        id: affected
        if: steps.baseline.outputs.db != ''
        run: |
          bash tools/test-graph/affected.sh \
            --db "${{ steps.baseline.outputs.db }}" \
            --base "${{ steps.baseline.outputs.base_sha }}" \
            --head "${{ github.sha }}" \
            --out target/test-graph/affected
          UT="$(cat target/test-graph/affected/ut.csv)"
          IT="$(cat target/test-graph/affected/it.csv)"
          if [ -z "$UT" ] && [ -z "$IT" ]; then
            echo "Nothing affected since ${{ steps.baseline.outputs.base_sha }} — baseline is already current."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          echo "ut=$UT" >> "$GITHUB_OUTPUT"
          echo "it=$IT" >> "$GITHUB_OUTPUT"

      - name: Run affected tests with per-test coverage
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip != '1'
        run: |
          cd "$GITHUB_WORKSPACE"
          # Restrict to the modules actually touched (real maven modules only),
          # so unrelated modules are neither compiled nor (with -am) re-built.
          MODS="$(grep -E '^dspace[a-z0-9-]*$' target/test-graph/affected/modules.txt \
                  | while read -r m; do [ -f "$m/pom.xml" ] && echo "$m"; done | sort -u | paste -sd, -)"
          [ -z "$MODS" ] && MODS="dspace-api"
          echo "affected modules: $MODS"
          UT="${{ steps.affected.outputs.ut }}"
          IT="${{ steps.affected.outputs.it }}"
          if [ -n "$UT" ]; then
            # $MVN unquoted on purpose: job env MVN="mvn -o -B" is a flag string,
            # and word-splitting must apply (a quoted "$MVN" would be one command).
            $MVN -pl "$MODS" -am -Ptest-class-graph -DskipUnitTests=false -DskipIntegrationTests=true \
              -DfailIfNoTests=false test "-Dtest=$UT" \
              || echo "!! affected unit tests failed (see above) — coverage may be incomplete for this patch"
          fi
          if [ -n "$IT" ]; then
            $MVN -pl "$MODS" -am -Ptest-class-graph -DskipUnitTests=true -DskipIntegrationTests=false \
              -DfailIfNoTests=false verify "-Dit.test=$IT" \
              || echo "!! affected integration tests failed (see above) — coverage may be incomplete for this patch"
          fi

      - name: Build per-module delta partials
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip != '1'
        run: |
          mkdir -p target/test-graph/deltas
          for mod in $(grep -E '^dspace[a-z0-9-]*$' target/test-graph/affected/modules.txt | sort -u); do
            [ -f "$mod/pom.xml" ] || continue
            [ -d "$mod/target/per-test" ] || continue
            n=$(find "$mod/target/per-test" -name '*.exec' | wc -l)
            [ "$n" -gt 0 ] || { echo "no coverage for $mod"; continue; }
            echo "delta partial for $mod ($n execs)"
            # --skip-tests: static + config + build from the .exec files already
            # produced above (no test re-run, per-test dir is preserved).
            bash tools/test-graph/phase-module.sh "$mod" --skip-tests \
              --db-out "target/test-graph/deltas/delta-$mod.sqlite"
          done

      - name: Merge deltas into baseline
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip != '1'
        run: |
          ARGS=("aggregate" "--out" "target/test-graph/root-index.sqlite")
          ARGS+=(--db "${{ steps.baseline.outputs.db }}")
          i=2
          for f in $(find target/test-graph/deltas -name 'delta-*.sqlite' | sort); do
            ARGS+=(--db$i "$f"); i=$((i+1))
          done
          bash tools/test-graph/run.sh "${ARGS[@]}" > target/test-graph/aggregate.log
          tail -5 target/test-graph/aggregate.log

      - name: Validate patched index
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip != '1'
        run: bash tools/test-graph/run.sh validate --db target/test-graph/root-index.sqlite || true

      - name: Keep prior baseline when nothing was affected
        if: steps.baseline.outputs.db != '' && steps.affected.outputs.skip == '1'
        run: |
          mkdir -p target/test-graph
          cp "${{ steps.baseline.outputs.db }}" target/test-graph/root-index.sqlite

      - name: Record source commit
        if: steps.baseline.outputs.db != ''
        run: echo "${{ github.sha }}" > target/test-graph/built-from.txt

      - name: Upload impact-index artifact
        if: steps.baseline.outputs.db != ''
        uses: actions/upload-artifact@v7
        with:
          name: impact-index
          path: |
            target/test-graph/root-index.sqlite
            target/test-graph/built-from.txt
          retention-days: 90